<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discipline - Trading Journal</title>
  </head>
  <body>
    <div id="app" class="flex h-screen w-full overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 bg-dark-panel/50 border-r border-gray-800 backdrop-blur-md flex flex-col h-full z-10">
        <div class="p-6 border-b border-gray-800">
          <h1 class="text-2xl font-bold tracking-wider text-white flex items-center gap-2">
            <i data-lucide="activity" class="text-neon-blue"></i>
            DISCIPLINE
          </h1>
        </div>
        <nav class="flex-1 p-4 space-y-2" id="main-nav">
          <button data-view="dashboard" class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors active-nav-item">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
          </button>
          <button data-view="calendar" class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
            <i data-lucide="calendar" class="w-5 h-5"></i> Calendar
          </button>
          <button data-view="psychology" class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
            <i data-lucide="brain" class="w-5 h-5"></i> Psychology
          </button>
          <button data-view="history" class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
            <i data-lucide="history" class="w-5 h-5"></i> History
          </button>
          <button data-view="analytics" class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
            <i data-lucide="pie-chart" class="w-5 h-5"></i> Analytics
          </button>
        </nav>
        <div class="p-4 border-t border-gray-800">
          <button id="btn-export-backup" class="w-full px-4 py-2 text-sm text-gray-400 hover:text-white flex items-center justify-center gap-2 border border-gray-700 rounded-lg hover:bg-white/5">
            <i data-lucide="download" class="w-4 h-4"></i> Export Backup
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 overflow-y-auto relative" id="main-content">
        <!-- Views will be injected here via JS -->
      </main>
    </div>

    <!-- Trade Entry Modal Shell -->
    <div id="trade-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
      <div class="glass-panel w-full max-w-4xl max-h-[90vh] overflow-y-auto m-4 transform scale-95 transition-transform duration-300" id="trade-modal-content">
        <!-- Modal content injected via JS -->
      </div>
    </div>

    <!-- Floating Add Trade Button -->
    <button id="btn-add-trade-fab"
      class="fixed bottom-7 right-7 z-40 w-14 h-14 rounded-full bg-neon-blue shadow-[0_0_25px_rgba(0,204,255,0.5)] flex items-center justify-center text-black hover:scale-110 active:scale-95 transition-transform duration-200"
      title="Add New Trade">
      <i data-lucide="plus" class="w-7 h-7 stroke-[2.5]"></i>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
